<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendly</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--b:#1d3a6e;--g:#12805c;--r:#c0392b;--l:#e2e6ef}
body{margin:0;font:15px/1.4 system-ui,-apple-system,sans-serif;background:#f4f6fb;color:#14213d;padding-bottom:72px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}
h1,h2,h3{margin:0}
button,input{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid #cfd6e4;border-radius:12px;margin:6px 0;background:#fff}
button{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
button:disabled{opacity:.35}
.pri{background:var(--b);color:#fff;border-color:var(--b);width:100%}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.acts{display:flex;gap:6px;margin-top:10px}.acts button{flex:1;padding:10px 2px;font-size:13px}
.st-p{background:#e3f6ee;color:var(--g)}.st-a{background:#fdeaea;color:var(--r)}.st-x{background:#eef0f4;color:#4b5563}
.on{outline:2px solid currentColor}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--b)}
.mut{color:#6b7690;font-size:13px}.big{font-size:34px;font-weight:700}
.tag{padding:3px 9px;border-radius:99px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex}
nav button{flex:1;border:0;border-radius:0;padding:15px}nav .cur{color:var(--b);font-weight:700}
.err{color:var(--r);font-size:13px;min-height:18px}
.ov{position:fixed;inset:0;background:rgba(20,33,61,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px 22px}
.rs{margin-top:8px;padding:8px 10px;background:#fdeaea;border-radius:10px;font-size:13px;color:#7a2118}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--l);font-size:14px}
</style></head>
<body><div id="app"></div>
<script>
const SB=supabase.createClient('https://anvfwfjekygqbelkuscs.supabase.co','sb_publishable_HlPtQSpODMf3yE0Oz8ewDQ_PJcJrq1j');
let CL=[],CM={},OV=new Set(),EV=[];
const S={tab:'today',date:new Date(),att:{},detail:null,stu:null,term:null,atab:'stu',ad:null};let A=null;

const $=s=>document.querySelector(s);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(p,a)=>p+a?Math.round(p/(p+a)*1000)/10:0;
const mail=r=>r.replace(/[^a-z0-9]/gi,'').toLowerCase()+'@attendly.app';
const classesOn=d=>{const k=ymd(d),w=d.getDay();return CL.filter(c=>c.on_date?c.on_date===k:c.weekday===w&&c.from_date<=k&&k<=c.to_date).map(c=>({...c,off:OV.has(c.id+'|'+k)})).sort((a,b)=>a.start_time.localeCompare(b.start_time))};
const terms=()=>{const m={};CL.forEach(c=>{const f=c.from_date||c.on_date;if(!m[c.term]||f<m[c.term])m[c.term]=f});return Object.keys(m).sort((a,b)=>m[a].localeCompare(m[b]))};
const codes=t=>[...new Set(CL.filter(c=>c.term===t).map(c=>c.code))].sort();
const nameOf=(t,k)=>(CL.find(c=>c.term===t&&c.code===k)||{}).name||k;
const fmt=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const tm=c=>fmt(c.start_time)+' – '+fmt(c.end_time);
const dl=k=>new Date(k+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
function curTerm(){const k=ymd(new Date()),T=terms();return T.find(t=>CL.some(c=>c.term===t&&c.from_date<=k&&k<=c.to_date))||T.filter(t=>CL.some(c=>c.term===t&&(c.from_date||c.on_date)<=k)).pop()||T[0]}
function stats(rows,t){
  const by={};codes(t).forEach(k=>by[k]={p:0,a:0,x:0});
  rows.forEach(r=>{const c=CM[r.class_id];if(!c||c.term!==t)return;const s=by[c.code];if(!s)return;if(r.status==='present')s.p++;else if(r.status==='absent')s.a++;else s.x++});
  let P=0,Ab=0;Object.values(by).forEach(s=>{P+=s.p;Ab+=s.a});
  return{by,P,A:Ab,pct:pct(P,Ab)};
}
async function fetchAll(qf){let all=[],i=0;for(;;){const{data,error}=await qf().range(i,i+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;i+=1000}return all}

/* ---------- auth ---------- */
function authView(msg,reg){
  $('#app').innerHTML=`<div class="wrap"><h1 style="margin:40px 0 4px">Attendly</h1><div class="mut" style="margin-bottom:16px">MDI Gurgaon · Attendance</div>
  <div class="card"><h3>${reg?'Create account':'Log in'}</h3>
  <input id="roll" placeholder="Roll number" autocapitalize="characters" autocomplete="username">
  ${reg?'<input id="nm" placeholder="Full name" autocomplete="name">':''}
  <input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="${reg?'new-password':'current-password'}">
  <div class="err">${esc(msg||'')}</div>
  <button class="pri" onclick="${reg?'signup()':'login()'}">${reg?'Register':'Log in'}</button>
  <p class="mut" style="text-align:center;margin:12px 0 0">${reg?`Have an account? <a href="#" onclick="authView('',false);return false">Log in</a>`:`New here? <a href="#" onclick="authView('',true);return false">Create account</a>`}</p></div>
  <p class="mut">Your attendance is visible to you and the batch admin.</p></div>`;
}
async function signup(){
  const roll=$('#roll').value.trim().toUpperCase(),name=$('#nm').value.trim(),pw=$('#pw').value;
  if(!mail(roll).startsWith('@')&&name&&pw.length>=6){
    const{data,error}=await SB.auth.signUp({email:mail(roll),password:pw,options:{data:{roll_no:roll,name}}});
    if(error)return authView(/registered/i.test(error.message)?'That roll number is already registered. Log in instead.':error.message,true);
    if(!data.session)return authView('Account created, but no session started. Turn off "Confirm email" in Supabase.',true);
    return loadUser(data.user);
  }
  authView('Enter your roll number, name and a password of 6+ characters.',true);
}
async function login(){
  const roll=$('#roll').value.trim(),pw=$('#pw').value;
  const{data,error}=await SB.auth.signInWithPassword({email:mail(roll),password:pw});
  if(error)return authView('Wrong roll number or password.',false);
  loadUser(data.user);
}
async function logout(){await SB.auth.signOut();S.att={};S.tab='today';S.detail=S.stu=null;A=null;authView()}
async function loadUser(u){
  try{
    const{data:p,error}=await SB.from('profiles').select('*').eq('id',u.id).single();
    if(error)throw error;
    const rows=await fetchAll(()=>SB.from('attendance').select('class_date,class_id,subject_id,status,reason').eq('user_id',u.id).order('class_date').order('class_id'));
    const[cl,ov,ev]=await Promise.all([fetchAll(()=>SB.from('classes').select('*').order('id')),fetchAll(()=>SB.from('class_overrides').select('*').order('class_id').order('on_date')),fetchAll(()=>SB.from('events').select('*').order('event_date').order('id'))]);
    CL=cl;CM={};cl.forEach(c=>CM[c.id]=c);OV=new Set(ov.map(o=>o.class_id+'|'+o.on_date));EV=ev;S.term=curTerm();
    S.user=u;S.profile=p;S.att={};rows.forEach(r=>S.att[r.class_date+'_'+r.class_id]=r);
    render();
  }catch(e){await SB.auth.signOut();authView('Could not load your account: '+e.message)}
}

/* ---------- student views ---------- */
const tab=(t,l)=>`<button class="${S.tab===t?'cur':''}" onclick="S.tab='${t}';S.detail=null;S.stu=null;render()">${l}</button>`;
function shell(inner){
  $('#app').innerHTML=`<div class="wrap"><div class="row sp" style="margin-bottom:12px"><div><h2>Attendly</h2><div class="mut">${esc(S.profile.name)} · ${esc(S.profile.roll_no)}</div></div><button onclick="logout()">Log out</button></div>${inner}</div>
  <nav>${tab('today','Today')}${tab('subjects','Subjects')}${tab('events','Events')}${tab('absences','Absences')}${S.profile.is_admin||S.profile.is_cr?tab('admin',S.profile.is_admin?'Admin':'Manage'):''}</nav>`;
}
function render(){({today:todayView,subjects:subjectsView,events:eventsView,absences:absencesView,admin:adminView})[S.tab]()}
const btns=(cid,sj,d,v)=>['present','absent','cancelled'].map((s,i)=>`<button class="st-${'pax'[i]}${v===s?' on':''}" style="${v&&v!==s?'opacity:.45':''}" onclick="${s==='absent'&&v!==s?`askReason('${cid}','${sj}','${d}')`:`mark('${cid}','${sj}','${d}','${v===s?'':s}')`}">${['✓ Present','✕ Absent','⊘ Cancelled'][i]}</button>`).join('');
const rsn=r=>r&&r.status==='absent'&&r.reason?`<div class="rs"><b>Reason:</b> ${esc(r.reason)}</div>`:'';
const termSel=()=>`<select style="width:auto;margin:0" onchange="S.term=this.value;S.detail=null;render()">${terms().map(t=>`<option${t===S.term?' selected':''}>${esc(t)}</option>`).join('')}</select>`;
const overall=()=>{const t=stats(Object.values(S.att),S.term);return`<div class="card"><div class="row sp"><span class="mut">Overall attendance</span>${termSel()}</div><div class="big">${t.pct}%</div><div class="mut">${t.P} present · ${t.A} absent (cancelled classes not counted)</div><div class="bar"><i style="width:${t.pct}%"></i></div></div>`};
const evRow=e=>`<div style="margin-top:8px"><b>${esc(e.title)}</b> <span class="tag st-x">${esc(e.kind)}</span><div class="mut">${dl(e.event_date)}${e.start_time?' · '+fmt(e.start_time)+(e.end_time?' – '+fmt(e.end_time):''):''}${e.venue?' · '+esc(e.venue):''}</div>${e.notes?`<div class="mut">${esc(e.notes)}</div>`:''}</div>`;

function todayView(){
  const d=S.date,k=ymd(d),tk=ymd(new Date()),isT=k===tk,cs=classesOn(d),soon=EV.filter(e=>e.event_date>=tk).slice(0,3);
  const cards=cs.map(c=>{const v=(S.att[k+'_'+c.id]||{}).status;
    return`<div class="card"><div class="row sp"><div><b>${esc(c.code)}</b>${c.on_date?' <span class="tag st-x">extra</span>':''}<div class="mut">${esc(c.name)}<br>${tm(c)}</div></div>${c.off?'<span class="tag st-x">Cancelled by college</span>':v?`<span class="tag st-${v[0]==='p'?'p':v[0]==='a'?'a':'x'}">${v}</span>`:''}</div>${c.off?'':`${rsn(S.att[k+'_'+c.id])}<div class="acts">${btns(c.id,c.code,k,v)}</div>`}</div>`}).join('');
  shell(`<div class="row" style="margin-bottom:12px"><button onclick="shiftDay(-1)">‹</button><input type="date" value="${k}" max="${tk}" onchange="pickDay(this.value)" style="margin:0"><button onclick="shiftDay(1)" ${isT?'disabled':''}>›</button>${isT?'':'<button onclick="S.date=new Date();render()">Today</button>'}</div>
  ${isT&&soon.length?`<div class="card"><b>Upcoming events</b>${soon.map(evRow).join('')}</div>`:''}${overall()}
  <h3 style="margin:4px 0 10px">${isT?"Today's classes":dl(k)}</h3>${cards||'<div class="card mut">No classes scheduled on this day.</div>'}`);
}
function shiftDay(n){const d=new Date(S.date.getFullYear(),S.date.getMonth(),S.date.getDate()+n);if(ymd(d)>ymd(new Date()))return;S.date=d;render()}
function pickDay(v){if(!v||v>ymd(new Date()))return;S.date=new Date(v+'T00:00:00');render()}
async function mark(cid,sj,d,st,reason){
  const k=d+'_'+cid;
  reason=st==='absent'?(reason||null):null;
  if(st)S.att[k]={class_date:d,class_id:cid,subject_id:sj,status:st,reason};else delete S.att[k];
  render();
  const id=S.user.id;
  const{error}=st?await SB.from('attendance').upsert({user_id:id,class_date:d,class_id:cid,subject_id:sj,status:st,reason},{onConflict:'user_id,class_date,class_id'}):await SB.from('attendance').delete().match({user_id:id,class_date:d,class_id:cid});
  if(error){alert('Could not save: '+error.message);loadUser(S.user)}
}
function subjectsView(){
  const st=stats(Object.values(S.att),S.term);
  if(S.detail){
    const j=S.detail,s=st.by[j]||{p:0,a:0,x:0},rows=Object.values(S.att).filter(r=>{const c=CM[r.class_id];return c&&c.term===S.term&&c.code===j}).sort((a,b)=>(b.class_date+b.class_id).localeCompare(a.class_date+a.class_id));
    return shell(`<button onclick="S.detail=null;render()">← All subjects</button>
    <div class="card" style="margin-top:12px"><h3>${esc(j)}</h3><div class="mut">${esc(nameOf(S.term,j))}</div><div class="big">${pct(s.p,s.a)}%</div><div class="mut">${s.p} present · ${s.a} absent · ${s.x} cancelled</div><div class="bar"><i style="width:${pct(s.p,s.a)}%"></i></div></div>
    <h3 style="margin:4px 0 10px">History</h3>
    ${rows.map(r=>`<div class="card"><b>${dl(r.class_date)}</b> <span class="mut">${tm(CM[r.class_id])}</span>${rsn(r)}<div class="acts">${btns(r.class_id,j,r.class_date,r.status)}</div></div>`).join('')||'<div class="card mut">Nothing marked yet. Mark classes from the Today tab.</div>'}`);
  }
  shell(overall()+(codes(S.term).map(k=>{const s=st.by[k],p=pct(s.p,s.a);
    return`<div class="card" onclick="S.detail='${k}';render()" style="cursor:pointer"><div class="row sp"><div><b>${esc(k)}</b><div class="mut">${esc(nameOf(S.term,k))}</div><div class="mut">${s.p}/${s.p+s.a} attended${s.x?' · '+s.x+' cancelled':''}</div></div><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')||'<div class="card mut">No subjects for this term yet.</div>'));
}
function askReason(cid,sj,d){
  const r=S.att[d+'_'+cid]||{},c=CM[cid]||{};
  const o=document.createElement('div');o.className='ov';o.id='rmodal';
  o.innerHTML=`<div class="md"><h3>${r.status==='absent'?'Edit reason':'Marked absent'}</h3><div class="mut">${esc(c.code||sj)} · ${dl(d)}</div>
  <textarea id="rtxt" rows="3" maxlength="300" placeholder="Why are you missing this class? (optional)">${esc(r.status==='absent'?(r.reason||''):'')}</textarea>
  <div class="row"><button style="flex:1" onclick="closeReason()">Cancel</button><button class="pri" style="flex:2" onclick="saveReason('${cid}','${sj}','${d}')">Save</button></div></div>`;
  o.addEventListener('click',e=>{if(e.target===o)closeReason()});
  document.body.appendChild(o);setTimeout(()=>{const t=$('#rtxt');t&&t.focus()},50);
}
function closeReason(){const m=$('#rmodal');m&&m.remove()}
function saveReason(cid,sj,d){const v=$('#rtxt').value.trim();closeReason();mark(cid,sj,d,'absent',v)}
function absencesView(){
  const rows=Object.values(S.att).filter(r=>r.status==='absent'&&CM[r.class_id]&&CM[r.class_id].term===S.term).sort((a,b)=>(b.class_date+b.class_id).localeCompare(a.class_date+a.class_id));
  shell(`<div class="row sp" style="margin-bottom:10px"><div><h3>Classes marked absent</h3><div class="mut">${rows.length} in ${esc(S.term||'')}</div></div>${termSel()}</div>`+
  (rows.map(r=>{const c=CM[r.class_id];return`<div class="card"><div class="row sp"><div><b>${esc(c.code)}</b> <span class="mut">${esc(c.name)}</span><div class="mut">${dl(r.class_date)} · ${tm(c)}</div></div><button onclick="askReason('${r.class_id}','${r.subject_id}','${r.class_date}')">${r.reason?'Edit':'Add reason'}</button></div>${r.reason?rsn(r):'<div class="mut" style="margin-top:6px">No reason added</div>'}</div>`}).join('')||'<div class="card mut">No absences marked this term.</div>'));
}
function eventsView(){
  const t=ymd(new Date()),up=EV.filter(e=>e.event_date>=t),past=EV.filter(e=>e.event_date<t).reverse().slice(0,5);
  shell(`<h3 style="margin:4px 0 10px">Upcoming events</h3><div class="card">${up.map(evRow).join('')||'<span class="mut">Nothing scheduled yet.</span>'}</div>${past.length?`<h3 style="margin:14px 0 10px">Recent</h3><div class="card">${past.map(evRow).join('')}</div>`:''}`);
}

/* ---------- admin ---------- */
const atabs=()=>`<div class="row" style="margin-bottom:12px">${[['stu','Students'],['tt','Timetable'],['ev','Events']].filter(x=>S.profile.is_admin||x[0]!=='stu').map(([k,l])=>`<button class="${S.atab===k?'pri':''}" style="flex:1" onclick="S.atab='${k}';S.stu=null;render()">${l}</button>`).join('')}</div>`;
const stOf=p=>stats(A.g[p.id]||[],S.term);
async function adminView(){
  if(!S.profile.is_admin&&!S.profile.is_cr)return;if(!S.profile.is_admin&&S.atab==='stu')S.atab='tt';
  if(S.atab==='tt')return adminTT();
  if(S.atab==='ev')return adminEv();
  if(S.stu&&A)return stuView();
  if(!A){
    shell(atabs()+'<div class="card mut">Loading students…</div>');
    try{
      const ps=await fetchAll(()=>SB.from('profiles').select('id,roll_no,name').order('roll_no'));
      const rs=await fetchAll(()=>SB.from('attendance').select('user_id,class_date,class_id,subject_id,status').order('user_id').order('class_date').order('class_id'));
      const g={};rs.forEach(r=>(g[r.user_id]=g[r.user_id]||[]).push(r));A={ps,g};
    }catch(e){return shell(atabs()+'<div class="card err">'+esc(e.message)+'</div>')}
  }
  shell(atabs()+`<div class="row sp"><input id="q" placeholder="Search roll number or name" oninput="alist()" style="margin-right:8px">${termSel()}</div>
  <div class="row sp" style="margin:6px 0 10px"><span class="mut" id="cnt"></span><span class="row"><button onclick="A=null;render()">Refresh</button><button onclick="csv()">Export CSV</button></span></div><div class="card" id="alist"></div>`);
  alist();
}
function alist(){
  const q=($('#q').value||'').toLowerCase(),L=A.ps.filter(p=>(p.roll_no+' '+p.name).toLowerCase().includes(q));
  $('#cnt').textContent=L.length+' students';
  $('#alist').innerHTML=L.length?`<table>${L.map(p=>`<tr><td><b>${esc(p.roll_no)}</b><div class="mut">${esc(p.name)}</div></td><td><b>${stOf(p).pct}%</b></td><td style="text-align:right"><button onclick="S.stu='${p.id}';render()">View</button></td></tr>`).join('')}</table>`:'<div class="mut">No students found.</div>';
}
function stuView(){
  const p=A.ps.find(x=>x.id===S.stu),t=stOf(p);
  shell(`<button onclick="S.stu=null;render()">← All students</button>
  <div class="card" style="margin-top:12px"><div class="row sp"><h3>${esc(p.name)}</h3>${termSel()}</div><div class="mut">${esc(p.roll_no)}</div><div class="big">${t.pct}%</div><div class="mut">${t.P} present · ${t.A} absent</div></div>
  <div class="card"><table><tr><th>Subject</th><th>P</th><th>A</th><th>Canc.</th><th>%</th></tr>${Object.keys(t.by).map(k=>{const s=t.by[k];return`<tr><td><b>${esc(k)}</b></td><td>${s.p}</td><td>${s.a}</td><td>${s.x}</td><td><b>${pct(s.p,s.a)}%</b></td></tr>`}).join('')}</table></div>`);
}
function csv(){
  const ks=codes(S.term),H=['Roll No','Name','Overall %',...ks.flatMap(k=>[k+' present',k+' absent',k+' %'])];
  const R=A.ps.map(p=>{const t=stOf(p);return[p.roll_no,p.name,t.pct,...ks.flatMap(k=>{const s=t.by[k];return[s.p,s.a,pct(s.p,s.a)]})]});
  const q=v=>'"'+String(v).replace(/^([=+\-@])/,"'$1").replace(/"/g,'""')+'"';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+[H,...R].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
  a.download='attendly-'+S.term.replace(/\W+/g,'-')+'-'+ymd(new Date())+'.csv';a.click();
}
function adminTT(){
  const k=S.ad||ymd(new Date()),cs=classesOn(new Date(k+'T00:00:00'));
  shell(atabs()+`<div class="card"><b>Manage a date</b><input type="date" value="${k}" onchange="S.ad=this.value;render()">
  ${cs.map(c=>`<div class="row sp" style="margin-top:8px"><div><b>${esc(c.code)}</b>${c.on_date?' (extra)':''}<div class="mut">${tm(c)}${c.off?' · cancelled for everyone':''}</div></div><span class="row"><button onclick="setOff('${c.id}','${k}',${c.off?0:1})">${c.off?'Restore':'Cancel'}</button>${c.on_date?`<button onclick="delClass('${c.id}')">Delete</button>`:''}</span></div>`).join('')||'<div class="mut" style="margin-top:8px">No classes on this date.</div>'}</div>
  <div class="card"><div class="row sp"><b>Add extra class on ${dl(k)}</b>${termSel()}</div><select id="xc">${codes(S.term).map(c=>`<option>${esc(c)}</option>`).join('')}</select>
  <div class="row"><input id="xs" type="time"><input id="xe" type="time"></div><button class="pri" onclick="addExtra('${k}')">Add class</button>
  <div class="mut" style="margin-top:6px">To reschedule: cancel the original class above, then add it on its new date.</div></div>
  <div class="card"><b>Add a term's timetable</b><input id="bt" placeholder="Term name, e.g. Term III"><div class="mut">Term start and end dates</div><div class="row"><input id="bf" type="date"><input id="bz" type="date"></div>
  <textarea id="bl" rows="6" placeholder="One class per line:&#10;CODE | Subject name | Days | Start | End&#10;MPI | Marketing Practices | Tue,Thu | 10:15 | 11:45"></textarea><button class="pri" onclick="bulk()">Add classes</button><div class="mut" style="margin-top:6px">Times in 24-hour format. Days: Mon–Sat.</div></div>`);
}
async function setOff(id,k,on){const{error}=on?await SB.from('class_overrides').upsert({class_id:id,on_date:k}):await SB.from('class_overrides').delete().match({class_id:id,on_date:k});if(error)return alert(error.message);on?OV.add(id+'|'+k):OV.delete(id+'|'+k);render()}
async function delClass(id){if(!confirm('Delete this class?'))return;const{error}=await SB.from('classes').delete().eq('id',id);if(error)return alert(error.message);CL=CL.filter(c=>c.id!==id);delete CM[id];render()}
async function addRows(rows){const{error}=await SB.from('classes').insert(rows);if(error)return alert(error.message);rows.forEach(r=>{CL.push(r);CM[r.id]=r});render()}
async function addExtra(k){const code=$('#xc').value,s=$('#xs').value,e=$('#xe').value,b=CL.find(c=>c.term===S.term&&c.code===code);if(!b||!s||!e)return alert('Pick a subject, start time and end time.');await addRows([{id:crypto.randomUUID(),term:S.term,code,name:b.name,on_date:k,start_time:s,end_time:e}])}
async function bulk(){
  const term=$('#bt').value.trim(),f=$('#bf').value,z=$('#bz').value,D={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6},rows=[],T=/^\d{1,2}:\d{2}$/;
  if(!term||!f||!z)return alert('Enter the term name, start date and end date.');
  for(const ln of $('#bl').value.split('\n')){
    if(!ln.trim())continue;
    const[code,name,days,s,e]=ln.split('|').map(x=>x.trim()),ds=(days||'').split(/[ ,]+/).map(x=>D[x.slice(0,3).toLowerCase()]).filter(x=>x!==undefined);
    if(!code||!name||!ds.length||!T.test(s||'')||!T.test(e||''))return alert('Check this line:\n'+ln);
    ds.forEach(w=>rows.push({id:crypto.randomUUID(),term,code:code.toUpperCase(),name,weekday:w,start_time:s.padStart(5,'0'),end_time:e.padStart(5,'0'),from_date:f,to_date:z}));
  }
  if(!rows.length)return alert('Add at least one class line.');
  S.term=term;await addRows(rows);
}
function adminEv(){
  shell(atabs()+`<div class="card"><b>Add an event</b><input id="et" placeholder="Title, e.g. Pre-placement talk – XYZ Ltd"><select id="ek"><option>Pre-placement talk</option><option>Corporate session</option><option>Other</option></select><input id="ed" type="date"><div class="row"><input id="es" type="time"><input id="ee" type="time"></div><input id="ev" placeholder="Venue (optional)"><textarea id="en" rows="2" placeholder="Notes (optional)"></textarea><button class="pri" onclick="addEv()">Post event</button></div>
  <div class="card">${EV.map(e=>`<div class="row sp" style="margin-bottom:8px"><div>${evRow(e)}</div><button onclick="delEv('${e.id}')">Delete</button></div>`).join('')||'<span class="mut">No events yet.</span>'}</div>`);
}
async function addEv(){
  const r={title:$('#et').value.trim(),kind:$('#ek').value,event_date:$('#ed').value,start_time:$('#es').value||null,end_time:$('#ee').value||null,venue:$('#ev').value.trim()||null,notes:$('#en').value.trim()||null};
  if(!r.title||!r.event_date)return alert('Title and date are required.');
  const{data,error}=await SB.from('events').insert(r).select().single();if(error)return alert(error.message);
  EV.push(data);EV.sort((a,b)=>(a.event_date+(a.start_time||'')).localeCompare(b.event_date+(b.start_time||'')));render();
}
async function delEv(id){if(!confirm('Delete this event?'))return;const{error}=await SB.from('events').delete().eq('id',id);if(error)return alert(error.message);EV=EV.filter(e=>e.id!==id);render()}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('.pri'))$('.pri').click()});
(async()=>{const{data:{session}}=await SB.auth.getSession();session?loadUser(session.user):authView()})();
</script></body></html>
